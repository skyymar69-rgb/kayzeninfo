<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary SEO -->
    <title>Kayzen – Agence digitale & solutions web</title>
    <meta name="description" content="Kayzen, agence digitale spécialisée en création de sites web, stratégie SEO et solutions digitales innovantes pour accélérer votre croissance en ligne." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kayzen.fr/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kayzen.fr/" />
    <meta property="og:title" content="Kayzen – Agence digitale & solutions web" />
    <meta property="og:description" content="Kayzen, agence digitale spécialisée en création de sites web, stratégie SEO et solutions digitales innovantes pour accélérer votre croissance en ligne." />
    <meta property="og:image" content="https://kayzen.fr/og-image.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Kayzen" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kayzen – Agence digitale & solutions web" />
    <meta name="twitter:description" content="Kayzen, agence digitale spécialisée en création de sites web, stratégie SEO et solutions digitales innovantes pour accélérer votre croissance en ligne." />
    <meta name="twitter:image" content="https://kayzen.fr/og-image.jpg" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Performant Google Fonts loading:
      - preload fires early, "as=style" ensures it's treated as CSS
      - onload swaps rel to stylesheet without blocking render
      - <noscript> fallback for no-JS
    -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      />
    </noscript>

    <!-- JSON-LD Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kayzen",
        "url": "https://kayzen.fr",
        "logo": "https://kayzen.fr/favicon.svg",
        "description": "Agence digitale spécialisée en création de sites web, stratégie SEO et solutions digitales innovantes.",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
